services:
  db:
    image: postgres:16
    container_name: procurement_db
    environment:
      POSTGRES_USER: procure
      POSTGRES_PASSWORD: procure123
      POSTGRES_DB: procurement
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
volumes:
  pgdata: